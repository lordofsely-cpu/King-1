name: Build Sely Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sely Launcher
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

          echo "Android SDK 34 is ready."

      - name: Find Sely Launcher ZIP
        shell: bash
        run: |
          echo "Files in repository:"
          find . -maxdepth 2 -type f -print

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in the repository."
            exit 1
          fi

          echo "Found Sely Launcher ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Sely Launcher
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find project \
            -name settings.gradle.kts \
            -o -name settings.gradle \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "AndroidX enabled."

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f build.gradle.kts || test -f build.gradle
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -d app/src/main

          echo "Android project verified."

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then
            echo "Gradle wrapper found."
            chmod +x gradlew
          else
            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper..."

            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip

            unzip -q gradle-8.7-bin.zip

            ./gradle-8.7/bin/gradle wrapper \
              --gradle-version 8.7

            chmod +x gradlew
          fi

      - name: Build Sely Launcher Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Upload Sely Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-Launcher-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
